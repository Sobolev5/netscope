  if (c.rtt_ms !== null) parts.push(`${t("rtt_hs")} ${qualityCell(c)}`);
  if (retr) parts.push(`<span class="text-amber-700">${t("retrans_full", { o: c.retrans_out, i: c.retrans_in })}</span>`);
  if (c.zero_window) parts.push(`<span class="text-red-600">${t("zero_win", { n: c.zero_window })}</span>`);
  const head = `<div class="panel mb-4">
    <div class="panel-h"><a href="${p ? "#/connections?pid=" + p.pid : "#/connections"}" style="text-decoration:none">${t("back")}</a>
      <h2 class="text-[15px]">${p ? esc(p.name) : t("unknown_proc")} <span class="text-slate-400">→</span> ${esc(c.name || c.remote_ip)}</h2>${chip(c.app)}<span class="text-[11px] uppercase text-slate-400">${esc(c.l4)}</span>${stateLabel(c.state)}
      <div class="ml-auto"><a class="btn" href="/api/connections/${c.id}/pcap">${t("export_pcap")}</a></div></div>
    <div class="grid gap-4 px-4 py-3 sm:grid-cols-2 xl:grid-cols-4">
      ${fact(t("process"), p ? `${procLabel(p)}<div class="mono text-[11px] text-slate-500">${esc(p.path || t("path_na"))}</div>` : `<span class="text-slate-500">${t("not_in_table")}</span>`)}
      ${fact(t("parent"), p && p.parent ? `${esc(p.parent_name || "?")} <span class="num text-[11px] text-slate-400">${p.parent}</span>` : "—")}
      ${fact(t("local_socket"), `<span class="mono">${esc(c.local)}</span> ${d.os_state ? `<span class="chip bg-emerald-50 text-emerald-700">${t("os_state")} ${esc(d.os_state)}</span>` : `<span class="text-[11px] text-slate-400">${t("os_closed")}</span>`}`)}
      ${fact(t("remote_socket"), `<span class="mono">${esc(c.remote)}</span>${c.name ? `<div class="text-[12px] text-slate-500">${esc(c.name)}</div>` : ""}`)}
      ${fact(t("located"), `${geoLine(c.geo)}<div class="text-[12px]">${orgLine(c.geo)}</div>`)}
      ${fact(t("quality"), `${parts.join(" · ") || "—"}<div class="text-[11px] text-slate-500">${t("hops_to")}: ${c.hops ?? "—"} (${t("by_ttl")})</div>`)}
      ${fact(t("who_opened"), init)}
      ${fact(t("traffic"), `<span class="num text-violet-700">↑ ${fmtBytes(c.bytes_out)}</span> <span class="text-[11px] text-slate-400">${fmtNum(c.packets_out)} ${t("packets_short")}</span> · <span class="num text-sky-700">↓ ${fmtBytes(c.bytes_in)}</span> <span class="text-[11px] text-slate-400">${fmtNum(c.packets_in)} ${t("packets_short")}</span><div class="text-[11px] text-slate-500">${clockUs(c.first_us)} → ${clockUs(c.last_us)} (${dur < 60 ? dur.toFixed(2) + " " + t("s") : duration(dur)})</div>`)}
    </div></div>`;
  const tab = (k, label) => `<button role="tab" aria-selected="${ui.detailTab === k}" data-dtab="${k}" class="border-b-2 px-3 py-2 ${ui.detailTab === k ? "border-blue-600 font-semibold text-blue-700" : "border-transparent text-slate-500 hover:text-slate-800"}">${label}</button>`;
  const tabs = `<div role="tablist" class="flex flex-wrap border-b border-[#e3e6eb] px-2">${tab("packets", `${t("t_packets")} <span class="num text-slate-400">${d.packets.length}</span>`)}${tab("stream", t("t_stream"))}${c.tls || d.tls_server ? tab("tls", t("t_tls")) : ""}${tab("route", t("t_route"))}${tab("sockets", `${t("t_sockets")} <span class="num text-slate-400">${d.sockets.length}</span>`)}</div>`;
  let body;
  if (ui.detailTab === "packets") body = viewPackets(d);
  else if (ui.detailTab === "stream") body = viewStream();
  else if (ui.detailTab === "tls") body = viewTls(d);
  else if (ui.detailTab === "route") { const tb = traceBlock(c.remote_ip); body = `<div class="flex items-center gap-2 border-b border-[#eef0f3] px-4 py-2 text-[12px] text-slate-500">${t("route_to", { ip: `<span class="mono text-slate-800">${esc(c.remote_ip)}</span>` })}<span class="ml-auto flex gap-2">${tb.btn}<button class="btn" data-watch-add="${esc(c.remote_ip)}" data-label="${esc(c.name || "")}">${t("watch_btn")}</button></span></div>${tb.body}`; }
  else body = `<table class="grid-table"><thead><tr><th>${t("proto")}</th><th>${t("local_addr")}</th><th>${t("remote_addr")}</th><th>${t("state")}</th></tr></thead><tbody>${d.sockets.map((x) => `<tr class="${x.current ? "bg-blue-50" : ""}"><td class="text-[11px] uppercase">${esc(x.proto)}</td><td class="mono text-[12px]">${esc(x.local)}</td><td class="mono text-[12px]">${esc(x.remote || "—")}</td><td class="text-[12px]">${esc(x.state || "")}${x.current ? ` <b class="text-blue-700">${t("this_conn")}</b>` : ""}</td></tr>`).join("") || empty(4, t("proc_unknown"))}</tbody></table>`;
  return head + `<section class="panel">${tabs}${body}</section>`;
}

function viewTls(d) {
  const c = d.conn.tls, s = d.tls_server;
  const row = (k, v) => (v ? `<tr><td class="w-48 text-slate-500">${k}</td><td class="mono break-all">${v}</td></tr>` : "");
  const client = c ? `<table class="grid-table"><tbody>${row("SNI", esc(c.sni || "—"))}${row(t("version"), esc(c.version))}${row(t("alpn"), esc(c.alpn.join(", ") || "—"))}${row(`JA4 <span title="${esc(t("ja4_tip"))}">ⓘ</span>`, esc(c.ja4))}</tbody></table>` : `<div class="px-4 py-3 text-slate-400">${t("no_tls")}</div>`;
  let server = `<div class="px-4 py-3 text-slate-400">${t("no_tls")}</div>`;
  if (s) {
    const nowSec = Date.now() / 1000;
    const certs = s.certificates.map((x, i) => `<div class="border-t border-[#eef0f3] px-4 py-2"><div class="mb-1 font-semibold">${t("cert")} #${i + 1}${x.self_signed ? ` <span class="chip bg-amber-100 text-amber-800">${t("self_signed")}</span>` : ""}${x.not_after_unix && x.not_after_unix < nowSec ? ` <span class="chip bg-red-100 text-red-800">${t("expired")}</span>` : ""}</div>
      <table class="grid-table"><tbody>${row(t("issued_to"), esc([x.subject_cn, x.subject_org].filter(Boolean).join(" · ")))}${row(t("issued_by"), esc([x.issuer_cn, x.issuer_org].filter(Boolean).join(" · ")))}${row(t("valid_until"), esc(x.not_after || ""))}${row(t("san"), esc(x.san.slice(0, 20).join(", ")))}${row(t("serial"), esc(x.serial))}</tbody></table></div>`).join("");
    server = s.incomplete ? `<div class="px-4 py-3 text-slate-500">${t("tls_incomplete")}</div>`
      : `<table class="grid-table"><tbody>${row(t("version"), esc(s.version || "—"))}${row(t("cipher"), esc(s.cipher || "—"))}${row(t("alpn"), esc(s.alpn || "—"))}</tbody></table>${s.encrypted_certificates ? `<div class="px-4 py-2 text-[12px] text-slate-500">${t("tls13_certs")}</div>` : ""}${certs}`;
  }
  return `<div class="grid xl:grid-cols-2"><div class="border-r border-[#eef0f3]"><div class="px-4 py-2 font-semibold">${t("tls_client")}</div>${client}</div><div><div class="px-4 py-2 font-semibold">${t("tls_server")}</div>${server}</div></div>`;
}

function pkClass(p) {
  const i = p.info;
  if (/\bRST\b/.test(i)) return "pk-rst";
  if (/\[(SYN|FIN)|, FIN|SYN, ACK/.test(i)) return "pk-syn";
  for (const [pre, cls] of [["HTTP", "pk-http"], ["TLS", "pk-tls"], ["DNS", "pk-dns"], ["QUIC", "pk-quic"], ["ICMP", "pk-icmp"], ["UDP", "pk-udp"]]) if (i.startsWith(pre)) return cls;
  return "pk-tcp";
}

function viewPackets(d) {
  const t0 = d.packets.length ? d.packets[0].ts_us : 0, c = d.conn;
  const rows = d.packets.map((p) => `<tr class="${pkClass(p)} ${ui.selected === p.n ? "sel" : ""}" data-pkt="${p.n}"><td class="num r">${p.n}</td><td class="num">${((p.ts_us - t0) / 1e6).toFixed(6)}</td>
      <td class="mono">${esc(p.outbound ? c.local : c.remote)}</td><td class="mono">${esc(p.outbound ? c.remote : c.local)}</td><td>${p.outbound ? "↑" : "↓"}</td><td class="num r">${p.wire_len}</td><td class="mono" style="max-width:640px;overflow:hidden;text-overflow:ellipsis">${esc(p.info)}</td></tr>`).join("");
  const dropped = d.dropped_packets ? `<div class="px-3 py-1 text-[11px] text-slate-500">${t("kept_last", { n: d.packets.length, d: fmtNum(d.dropped_packets) })}</div>` : "";
  return `${dropped}<div class="scroll max-h-[34vh] border-b border-[#e3e6eb]"><table class="pk grid-table"><thead><tr><th class="r">${t("no_col")}</th><th>${t("time")}</th><th>${t("src")}</th><th>${t("dst")}</th><th></th><th class="r">${t("length")}</th><th>${t("info")}</th></tr></thead>
    <tbody>${rows || empty(7, t("no_packets"))}</tbody></table></div><div id="inspector">${viewInspector()}</div>`;
}

function viewInspector() {
  const pk = ui.packet;
  if (!ui.selected) return `<div class="py-8 text-center text-slate-400">${t("pkt_pick")}</div>`;
  if (!pk) return `<div class="py-8 text-center text-slate-400">${t("pkt_parsing")}</div>`;
  if (pk.error) return `<div class="py-8 text-center text-slate-500">${esc(pk.error)}</div>`;
  const bytes = pk.hex.match(/../g) || [];
  const layerOf = new Array(bytes.length).fill(-1);
  pk.layers.forEach((l, i) => { for (let k = l.range[0]; k < Math.min(l.range[1], bytes.length); k++) layerOf[k] = i; });
  const tree = pk.layers.map((l, i) => `<details ${ui.closedLayers.has(l.name) ? "" : "open"} data-layer="${esc(l.name)}"><summary data-range="${l.range[0]},${l.range[1]}"><b class="lyr${i % 7}">${esc(l.name)}</b>, ${esc(l.summary)}</summary>
      ${l.fields.map((f) => `<div class="f" data-range="${f.range[0]},${f.range[1]}" title="${esc(f.name)}: ${esc(f.value)}"><span class="text-slate-500">${esc(f.name)}:</span> <span class="mono">${esc(f.value)}</span></div>`).join("")}</details>`).join("");
  const limit = ui.hexAll ? bytes.length : Math.min(bytes.length, 1024);
  let hex = "";
  for (let off = 0; off < limit; off += 16) {
    let h = "", a = "";
    for (let k = off; k < Math.min(off + 16, limit); k++) {
      const v = parseInt(bytes[k], 16), cls = layerOf[k] >= 0 ? "lyr" + (layerOf[k] % 7) : "text-slate-400";
      h += `<span data-b="${k}" class="${cls}">${bytes[k]}</span>${k % 16 === 7 ? "  " : " "}`;
      a += `<span data-b="${k}" class="${cls}">${v >= 0x20 && v < 0x7f ? esc(String.fromCharCode(v)) : "·"}</span>`;
    }
    hex += `<div><span class="text-slate-400">${off.toString(16).padStart(4, "0")}</span>  <span class="hex">${h}</span> <span class="ascii">${a}</span></div>`;
  }
  const more = bytes.length > limit ? `<button id="hex-all" class="btn mt-2">${t("show_all", { n: fmtNum(bytes.length) })}</button>` : "";
  const trunc = pk.wire_len > bytes.length ? `<div class="mt-1 text-[11px] text-slate-500">${t("stored_of", { a: fmtNum(bytes.length), b: fmtNum(pk.wire_len) })}</div>` : "";
  return `<div class="flex items-center gap-3 border-b border-[#eef0f3] px-3 py-1.5 text-[12px] text-slate-500"><b class="text-slate-800">${t("frame")} ${pk.n}</b>: ${fmtNum(pk.wire_len)} ${t("bytes")}, ${pk.outbound ? t("sent_v") : t("recv_v")} ${clockUs(pk.ts_us)}<span class="ml-auto">${t("hover_hint")}</span></div>
    <div class="grid xl:grid-cols-2"><div class="tree scroll max-h-[46vh] border-r border-[#eef0f3] py-1" id="layers">${tree}</div><div class="mono scroll max-h-[46vh] bg-[#fbfbfc] p-3 text-[12px] leading-5" id="hexdump">${hex}${more}${trunc}</div></div>`;
}

function viewStream() {
  const s = ui.stream;
  if (!s) return `<div class="py-8 text-center text-slate-400">${t("assembling")}</div>`;
  if (s.error) return `<div class="py-8 text-center text-slate-500">${esc(s.error)}</div>`;
  const head = `<div class="flex flex-wrap gap-4 border-b border-[#eef0f3] px-4 py-2 text-[12px]"><span class="text-violet-700">${t("stream_out")} ${fmtBytes(s.bytes_out)}</span><span class="text-sky-700">${t("stream_in")} ${fmtBytes(s.bytes_in)}</span>
      ${s.dropped_packets ? `<span class="text-slate-500">${t("stream_drop", { n: fmtNum(s.dropped_packets) })}</span>` : ""}${s.truncated ? `<span class="text-slate-500">${t("stream_trunc")}</span>` : ""}</div>
    ${s.encrypted ? `<div class="border-b border-[#eef0f3] bg-slate-50 px-4 py-2 text-[12px] text-slate-600">${t("stream_enc")}</div>` : ""}`;
  const segs = s.segments.map((g) => `${g.gap_before ? `<div class="py-1 text-center text-[11px] text-amber-700">${t("stream_gap", { n: fmtNum(g.gap_before) })}</div>` : ""}
      <div class="border-l-4 ${g.outbound ? "border-violet-400 bg-violet-50/50" : "border-sky-400 bg-sky-50/60"}"><div class="px-3 pt-1 text-[11px] ${g.outbound ? "text-violet-700" : "text-sky-700"}">${g.outbound ? t("stream_out") : t("stream_in")} · <span class="num">${fmtNum(g.bytes)} ${t("bytes")} · ${g.packets} ${t("packets_short")} · ${clockUs(g.ts_us)}</span>${g.readable ? "" : " · " + t("stream_bin")}</div>
        <pre class="stream mono scroll max-h-96 px-3 pb-2 text-[12px]">${g.readable ? esc(g.text) : formatHex(g.hex)}</pre></div>`).join("");
  return head + `<div class="space-y-1 p-2">${segs || `<div class="py-8 text-center text-slate-400">${t("stream_none")}</div>`}</div>`;
}

function formatHex(hex) {
  const b = hex.match(/../g) || [];
  let o = "";
  for (let i = 0; i < b.length; i += 16) o += b.slice(i, i + 16).join(" ") + "\n";
  return o;
}

/** `first` = the page was just opened: apply the URL's tab/packet and start a trace if asked. */
async function refreshDetail(first) {
  const id = route.params.id, seq = ++ui.seq.detail;
  let detail;
  try { detail = await getJson(`/api/connections/${id}`); }
  catch (e) { detail = { error: e.status === 404 ? t("conn_gone") : String(e.message || e) }; }
  if (seq !== ui.seq.detail || route.params.id !== id) return;
  ui.detail = detail;
  if (first && route.params.tab) ui.detailTab = route.params.tab;
  if (ui.detailTab === "stream" && !detail.error) {
    try { ui.stream = await getJson(`/api/connections/${id}/stream`); } catch (e) { ui.stream = { error: String(e.message || e) }; }
    if (seq !== ui.seq.detail) return;
  }
  // Plain renderView(): with the "route changed" flag it would reschedule polling, which
  // calls refreshDetail again — an endless request loop.
  if (route.name === "conn") renderView();
  if (first && route.params.pkt && ui.selected === null) selectPacket(Number(route.params.pkt));
  if (first && ui.detailTab === "route" && !detail.error && !ui.traces[detail.conn.remote_ip]) runTrace(detail.conn.remote_ip);
}

async function selectPacket(n) {
  ui.selected = n; ui.packet = null; ui.hexAll = false;
  const seq = ++ui.seq.packet;
  renderView();
  let pk;
  try { pk = await getJson(`/api/connections/${route.params.id}/packets/${n}`); } catch (e) { pk = { error: t("pkt_gone") }; }
  if (seq !== ui.seq.packet) return; // the user already moved on (arrow keys)
  ui.packet = pk;
  if (route.name === "conn") renderView();
}

// ================= notifications & language =================

function notifyNew(s) {
  if (IN_APP || !s.alerts.length) return;
  const newest = s.alerts[0].id;
  if (ui.notifiedUpTo === null || !ui.notify || !("Notification" in window) || Notification.permission !== "granted") { ui.notifiedUpTo = newest; return; }
  const fresh = s.alerts.filter((a) => a.id > ui.notifiedUpTo).slice(0, 3);
  ui.notifiedUpTo = newest;
  for (const a of fresh) {
    const tmp = document.createElement("div");
    tmp.innerHTML = alertText(a);
    try { new Notification(`netscope · ${t("kind_" + a.kind)}`, { body: tmp.textContent, tag: "netscope-" + a.id }); } catch (e) { /* notifications unavailable */ }
  }
}

$("notify-btn").addEventListener("click", async () => {
  if (!("Notification" in window)) return;
  if (!ui.notify) {
    const perm = Notification.permission === "granted" ? "granted" : await Notification.requestPermission();
    if (perm !== "granted") { window.alert(t("notify_denied")); return; }
  }
  ui.notify = !ui.notify;
  store.set("notify", ui.notify);
  renderChrome();
});

$("lang").addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-lang]");
  if (!b) return;
  LANG = b.dataset.lang;
  store.set("lang", LANG);
  renderChrome();
  if (last) renderHeader(last);
  renderView();
});

// ================= rendering & events =================

/** A selector that finds the same row again after the view is rebuilt (rows have no ids). */
function focusKey(el) {
  if (!el || el === document.body) return null;
  if (el.id) return "#" + CSS.escape(el.id);
  const row = el.closest(".clickable");
  if (!row) return null;
  for (const k of ["conn", "pid", "host", "sockpid", "procname", "group", "pkt", "traceGoto", "watchAdd", "watchRemove"]) {
    if (row.dataset[k] !== undefined) return `.clickable[data-${k.replace(/[A-Z]/g, (c) => "-" + c.toLowerCase())}="${CSS.escape(row.dataset[k])}"]`;
  }
  return null;
}

function renderView(routeChanged) {
  // Replacing the DOM under a pointer drag would detach the map: draw again when it ends.
  if (ui.mapDrag) { ui.renderPending = true; return; }
  renderNav();
  const v = $("view");
  const focused = focusKey(document.activeElement);
  const caret = focused && "selectionStart" in document.activeElement ? document.activeElement.selectionStart : null;
  const scrolls = [...v.querySelectorAll(".scroll")].map((e) => e.scrollTop);
  let html;
  if (route.name === "conn") html = viewConnection();
  else if (route.name === "dns") html = viewDns();
  else if (route.name === "sockets") html = viewSockets();
  else if (route.name === "settings") html = viewSettings();
  else if (route.name === "journal") html = viewJournal(last);
  else if (!last) html = panel("netscope", `<div class="py-10 text-center text-slate-400">${t("waiting")}</div>`);
  else html = ({ processes: viewProcesses, connections: viewConnections, hosts: viewHosts, map: viewMap, route: viewRoute, dns: viewDns, sockets: viewSockets, alerts: viewAlerts }[route.name] || viewOverview)(last);
  v.innerHTML = html;
  v.querySelectorAll(".map-wrap").forEach(layoutLabels);
  // Keyboard access: clickable rows are focusable (Enter/Space activate them, see below);
  // search boxes get their placeholder as an accessible name.
  v.querySelectorAll(".clickable").forEach((e) => e.setAttribute("tabindex", "0"));
  v.querySelectorAll("input[placeholder]:not([aria-label])").forEach((i) => i.setAttribute("aria-label", i.placeholder));
  if (!routeChanged) v.querySelectorAll(".scroll").forEach((e, i) => { if (scrolls[i] !== undefined) e.scrollTop = scrolls[i]; });
  const again = focused && document.querySelector(focused);
  if (again) { again.focus({ preventScroll: true }); if (caret !== null) try { again.setSelectionRange(caret, caret); } catch (e) { /* not a text input */ } }
  if (routeChanged) schedulePolling();
}

function schedulePolling() {
  clearInterval(pollTimer); pollTimer = null;
  const every = (fn, ms) => { fn(); pollTimer = setInterval(fn, ms); };
  if (route.name === "conn") { refreshDetail(true); pollTimer = setInterval(refreshDetail, 2000); }
  else if (route.name === "sockets") every(refreshSockets, 2000);
  else if (route.name === "dns") every(refreshDns, 3000);
  else if (route.name === "connections" && (route.params.pid !== undefined || ui.connQuery.trim())) { connCache = null; every(refreshConnections, 2000); }
  else if (route.name === "route" || route.name === "hosts") { every(refreshWatch, 5000); if (route.name === "route" && ui.routeIp && !ui.traces[ui.routeIp]) runTrace(ui.routeIp); }
  else if (route.name === "settings") { ui.settings.status = null; loadSettings(); }
  else if (route.name === "journal") { if (route.params.kind) ui.journal.kind = route.params.kind; refreshJournal(); }
  syncFacetUrl();
}

/** A filter drop-down has the focus (maybe open): re-rendering now would close it. */
const fselOpen = () => !!(document.activeElement && document.activeElement.classList && document.activeElement.classList.contains("fsel"));

function setConnQuery(q) {
  ui.connQuery = q; store.set("connQuery", q);
  if (route.name === "connections" && route.params.pid === undefined) { schedulePolling(); renderView(); } else location.hash = "#/connections";
}

$("view").addEventListener("click", (ev) => {
  const el = ev.target;
  const hit = (sel) => el.closest(sel);
  let x;
  if ((x = hit("[data-map-zoom]"))) {
    const wrap = x.closest(".map-wrap"), key = wrap.dataset.map;
    if (x.dataset.mapZoom === "reset") ui.mapViews[key] = null; else zoomView(key, x.dataset.mapZoom === "in" ? 0.5 : 2);
    applyMapView(wrap); return;
  }
  // Filter bars and clickable values (before the row handlers: the values sit in rows).
  if ((x = hit("[data-fadd]"))) { ev.stopPropagation(); addFacetValue(x.dataset.fadd, x.dataset.v); return; }
  if ((x = hit("[data-ftog]"))) { const k = facetKey(); if (k) setFacets(k, facetToggle(facetState(k), x.dataset.ftog, x.dataset.v)); return; }
  if ((x = hit("[data-fflag]"))) { const k = x.dataset.fv, st = { ...facetState(k) }; if (st[x.dataset.fflag]) delete st[x.dataset.fflag]; else st[x.dataset.fflag] = true; setFacets(k, st); return; }
  if ((x = hit("[data-fdel]"))) { setFacets(x.dataset.fv, facetToggle(facetState(x.dataset.fv), x.dataset.fdel, x.dataset.v)); return; }
  if ((x = hit("[data-freset]"))) { setFacets(x.dataset.fv, {}); return; }
  if ((x = hit("[data-fclause]"))) { setConnQuery(toggleClause(ui.connQuery, x.dataset.fclause)); return; }
  if ((x = hit("[data-fclear]"))) { setConnQuery(""); return; }
  if ((x = hit("[data-mapcluster]"))) { ui.mapCluster = x.dataset.mapcluster || null; renderView(); return; }
  if ((x = hit("[data-goto]"))) { location.hash = x.dataset.goto; return; }
  if ((x = hit("[data-watch-add]"))) { ev.stopPropagation(); watchChange("POST", x.dataset.watchAdd, x.dataset.label); return; }
  if ((x = hit("[data-watch-remove]"))) { watchChange("DELETE", x.dataset.watchRemove); return; }
  if (el.id === "watch-add") { const ip = $("watch-ip").value.trim(); if (ip) watchChange("POST", ip); return; }
  if (el.id === "help-btn") { ui.help = !ui.help; if (ui.help && !ui.fields.length) getJson("/api/filter/fields").then((f) => { ui.fields = f; renderView(); }); renderView(); return; }
  if ((x = hit("[data-trace]"))) { const ip = route.name === "route" && $("route-ip") ? $("route-ip").value.trim() : x.dataset.trace; if (ip) { ui.routeIp = ip; runTrace(ip, !!ui.traces[ip]); } return; }
  if ((x = hit("[data-trace-goto]"))) { ev.stopPropagation(); location.hash = `#/route?ip=${encodeURIComponent(x.dataset.traceGoto)}`; return; }
  if ((x = hit("[data-pid]"))) { location.hash = `#/connections?pid=${x.dataset.pid}`; return; }
  if ((x = hit("[data-group]"))) { const g = x.dataset.group; if (ui.expanded.has(g)) ui.expanded.delete(g); else ui.expanded.add(g); renderView(); return; }
  if ((x = hit("[data-conn]"))) { location.hash = `#/conn/${x.dataset.conn}`; return; }
  if ((x = hit("[data-procname]"))) { setConnQuery(`process == "${x.dataset.procname.replace(/"/g, '\\"')}"`); return; }
  if ((x = hit("[data-host]"))) { const ip = x.dataset.host; setConnQuery(`ip == ${ip.includes(":") ? `"${ip}"` : ip}`); return; }
  if ((x = hit("[data-sockpid]")) && x.dataset.sockpid !== "0") { location.hash = `#/connections?pid=${x.dataset.sockpid}`; return; }
  if ((x = hit("[data-filter]"))) { ui.alertFilter = x.dataset.filter; renderView(); return; }
  if ((x = hit("[data-dtab]"))) {
    ui.detailTab = x.dataset.dtab; ui.stream = null; renderView(); refreshDetail();
    if (ui.detailTab === "route" && ui.detail && !ui.detail.error && !ui.traces[ui.detail.conn.remote_ip]) runTrace(ui.detail.conn.remote_ip);
    return;
  }
  if ((x = hit("[data-pkt]"))) { selectPacket(Number(x.dataset.pkt)); return; }
  if (el.id === "hex-all") { ui.hexAll = true; renderView(); }
  if (el.id === "set-save") { saveSettings(); return; }
  if ((x = hit("[data-copy]"))) { navigator.clipboard && navigator.clipboard.writeText(x.dataset.copy).then(() => { x.textContent = t("set_copied"); setTimeout(() => { x.textContent = t("set_copy"); }, 1500); }).catch(() => {}); return; }
  if ((x = hit("[data-jkind]"))) { ui.journal.kind = x.dataset.jkind; ui.journal.data = null; renderView(); refreshJournal(); return; }
  if ((x = hit("[data-jrange]"))) { ui.journal.range = x.dataset.jrange; renderView(); refreshJournal(); return; }
  if (el.id === "journal-refresh") { ui.journal.stats = null; refreshJournal(); return; }
  if (el.id === "set-restart") { restartNow(); }
  if (el.id === "set-unsnooze") { unsnooze(); }
});

// Filter drop-downs: a value or a choice was picked (the drop-down gives the focus back, so
// the next snapshot may redraw the page).
$("view").addEventListener("change", (ev) => {
  const el = ev.target, d = el.dataset || {};
  if (d.fmulti === undefined && d.fpick === undefined && d.fq === undefined) return;
  el.blur();
  if (d.fmulti !== undefined && el.value) setFacets(d.fv, facetToggle(facetState(d.fv), d.fmulti, el.value));
  else if (d.fpick !== undefined) { const st = { ...facetState(d.fv) }; if (el.value) st[d.fpick] = el.value; else delete st[d.fpick]; setFacets(d.fv, st); }
  else if (d.fq !== undefined && el.value) setConnQuery(addClause(ui.connQuery, el.value));
});

// Settings form: keep the edited values in ui.settings.form (the page re-renders on save).
$("view").addEventListener("change", (ev) => {
  const f = ui.settings.form, el = ev.target;
  if (!f || !el.id || !el.id.startsWith("set-")) return;
  const key = el.id.slice(4).replace(/-/g, "_");
  if (el.type === "checkbox") f[key] = el.checked; else f[key] = el.value;
  if (key === "host") renderView();
});

$("view").addEventListener("keydown", (ev) => {
  if ((ev.key === "Enter" || ev.key === " ") && ev.target.classList && ev.target.classList.contains("clickable")) { ev.preventDefault(); ev.target.click(); return; }
  if (ev.key !== "Enter") return;
  const ip = ev.target.value && ev.target.value.trim();
  if (ev.target.id === "route-ip" && ip) { ui.routeIp = ip; runTrace(ip, true); }
  if (ev.target.id === "watch-ip" && ip) watchChange("POST", ip);
});
// Remember which inspector layers the user collapsed ("toggle" does not bubble: capture it).
$("view").addEventListener("toggle", (ev) => {
  const d = ev.target;
  if (d.tagName !== "DETAILS" || !d.dataset.layer) return;
  if (d.open) ui.closedLayers.delete(d.dataset.layer); else ui.closedLayers.add(d.dataset.layer);
}, true);
// "/" jumps to the connection filter, like in many web apps.
document.addEventListener("keydown", (ev) => {
  if (ev.key !== "/" || ev.ctrlKey || ev.metaKey || ev.altKey || ["INPUT", "TEXTAREA"].includes(ev.target.tagName)) return;
  ev.preventDefault();
  if ($("conn-q")) $("conn-q").focus(); else location.hash = "#/connections";
});

// Arrow keys move through the packet list, like in Wireshark.
document.addEventListener("keydown", (ev) => {
  if (route.name !== "conn" || ui.detailTab !== "packets" || !ui.detail || ui.detail.error || ev.target.tagName === "INPUT") return;
  if (ev.key !== "ArrowDown" && ev.key !== "ArrowUp") return;
  const ns = ui.detail.packets.map((p) => p.n);
  if (!ns.length) return;
  const i = ns.indexOf(ui.selected);
  const next = ev.key === "ArrowDown" ? ns[Math.min(ns.length - 1, i + 1)] : ns[Math.max(0, i - 1)];
  ev.preventDefault();
  if (next !== undefined) selectPacket(next);
});

function highlight(range, on) {
  const [a, b] = range.split(",").map(Number);
  document.querySelectorAll("#hexdump span[data-b]").forEach((s) => { const k = Number(s.dataset.b); if (k >= a && k < b) s.classList.toggle("hl", on); });
}
$("view").addEventListener("mouseover", (ev) => { const r = ev.target.closest("#layers [data-range]"); if (r) highlight(r.dataset.range, true); });
$("view").addEventListener("mouseout", (ev) => { const r = ev.target.closest("#layers [data-range]"); if (r) highlight(r.dataset.range, false); });

$("view").addEventListener("input", (ev) => {
  const id = ev.target.id, val = ev.target.value;
  // Raw text is kept so re-rendering never eats a space the user just typed.
  if (id === "conn-q") {
    ui.connQuery = val; store.set("connQuery", val);
    clearTimeout(ev.target._t);
    ev.target._t = setTimeout(() => { schedulePolling(); renderView(); }, 300);
  } else if (id === "sock-q") { ui.sockQuery = val; renderView(); }
  else if (id === "host-q") { ui.hostQuery = val; renderView(); }
  else if (id === "proc-q") { ui.procQuery = val; renderView(); }
  else if (id === "alert-q") { ui.alertQuery = val; renderView(); }
  else if (id === "dns-q") { ui.dnsQuery = val; clearTimeout(ev.target._t); ev.target._t = setTimeout(refreshDns, 300); }
  else if (id === "route-ip") ui.routeIp = val.trim();
  else if (id === "journal-q") { ui.journal.q = val; clearTimeout(ev.target._t); ev.target._t = setTimeout(refreshJournal, 300); }
  else if (id.startsWith("set-") && ui.settings.form) { const key = id.slice(4).replace(/-/g, "_"); if (ev.target.type !== "checkbox") ui.settings.form[key] = val; }
});

function onSnapshot(s) {
  const first = !last;
  last = s;
  renderHeader(s);
  notifyNew(s);
  // These views refresh on their own timers; typing must not be interrupted.
  const self = ["conn", "sockets", "dns", "settings", "journal"].includes(route.name) || (route.name === "connections" && (route.params.pid !== undefined || ui.connQuery.trim()));
  const typing = (document.activeElement && ["route-ip", "watch-ip"].includes(document.activeElement.id)) || ui.mapDrag || fselOpen();
  // The very first snapshot must always render: self-refreshing views may have drawn a placeholder.
  if (first || (!self && !typing)) renderView(); else renderNav();
}

function setConn(state) {
  connState = state;
  const v = { live: ["bg-emerald-500", "conn_live"], polling: ["bg-amber-400", "conn_polling"], offline: ["bg-red-500", "conn_offline"] }[state];
  $("conn").innerHTML = `<span class="h-2 w-2 rounded-full ${v[0]}"></span>${t(v[1])}`;
}

let statsPoll = null;
function startPolling() {
  if (statsPoll) return;
  const poll = () => getJson("/api/stats").then((s) => { onSnapshot(s); setConn("polling"); }).catch(() => setConn("offline"));
  poll();
  statsPoll = setInterval(poll, 3000);
}
function stopPolling() { clearInterval(statsPoll); statsPoll = null; }

let retries = 0;
function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/api/ws`);
  ws.onopen = () => { retries = 0; stopPolling(); setConn("live"); };
  ws.onmessage = (ev) => { try { onSnapshot(JSON.parse(ev.data)); } catch (e) { console.error("bad snapshot", e); } };
  ws.onclose = () => { startPolling(); setTimeout(connect, Math.min(10000, 1000 * 2 ** retries++)); };
  ws.onerror = () => ws.close();
}

route = parseRoute();
if (route.name === "route" && route.params.ip) ui.routeIp = route.params.ip;
if (route.name === "connections" && route.params.q !== undefined) ui.connQuery = route.params.q;
facetsFromUrl();
renderChrome();
renderView(true);
connect();
</script>
</body>
</html>
