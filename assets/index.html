    const env = body && typeof body === "object" && body.error && typeof body.error === "object" ? body.error : null;

// ================= filter bars and map layout: pure logic =================
// BEGIN PURE: no DOM, no globals; tests/ui_logic.rs runs tests/js/ui_logic.test.js on this block.
//
// A filter bar is a list of definitions over table rows:
//   { id, kind: "multi", get(row) -> value | [values] }   any of the chosen values
//   { id, kind: "pick", options: [{ v, test(row) }] }       one choice, e.g. "active in 5 min"
//   { id, kind: "flag", test(row) }                         on/off, e.g. "unsigned only"
// Its state is { [id]: [values] | "choice" | true }; a missing or empty entry means "any".

const facetVals = (x) => (Array.isArray(x) ? x : x === null || x === undefined || x === "" ? [] : [x]).map(String);
const facetOn = (st, id) => { const v = st && st[id]; return Array.isArray(v) ? v.length > 0 : !!v; };

/** The row passes every filter of `st` except the one on `skip`. */
function facetMatch(st, defs, row, skip) {
  for (const d of defs) {
    if (d.id === skip || !facetOn(st, d.id)) continue;
    const want = st[d.id];
    if (d.kind === "multi") {
      const have = facetVals(d.get(row)).map((v) => v.toLowerCase());
      if (!want.some((w) => have.includes(String(w).toLowerCase()))) return false;
    } else if (d.kind === "pick") {
      const o = d.options.find((x) => x.v === want);
      if (o && !o.test(row)) return false;
    } else if (d.kind === "flag" && !d.test(row)) return false;
  }
  return true;
}

const facetFilter = (st, defs, rows) => rows.filter((r) => facetMatch(st, defs, r));

/** Values of a multi filter with counts over the rows the other filters let through, the
 *  most frequent first; chosen values stay listed (count 0) so they can be removed. */
function facetOptions(st, defs, rows, id) {
  const d = defs.find((x) => x.id === id);
  const counts = new Map();
  for (const r of rows) {
    if (!facetMatch(st, defs, r, id)) continue;
    for (const v of new Set(facetVals(d.get(r)))) counts.set(v, (counts.get(v) || 0) + 1);
  }
  for (const v of (st && Array.isArray(st[id]) ? st[id] : [])) if (![...counts.keys()].some((k) => k.toLowerCase() === String(v).toLowerCase())) counts.set(String(v), 0);
  return [...counts.entries()].map(([v, n]) => ({ v, n })).sort((a, b) => b.n - a.n || (a.v < b.v ? -1 : a.v > b.v ? 1 : 0));
}

/** Adds or removes one value of a multi filter; returns the new state (the old one is kept). */
function facetToggle(st, id, v) {
  const cur = Array.isArray(st[id]) ? st[id] : [];
  const has = cur.some((x) => String(x).toLowerCase() === String(v).toLowerCase());
  const next = has ? cur.filter((x) => String(x).toLowerCase() !== String(v).toLowerCase()) : cur.concat([v]);
  const out = { ...st };
  if (next.length) out[id] = next; else delete out[id];
  return out;
}

const facetCount = (st) => Object.keys(st || {}).filter((k) => facetOn(st, k)).length;

/** URL form of a state (`f=` parameter): only the active filters, as JSON. */
function facetEncode(st) {
  const out = {};
  for (const k of Object.keys(st || {}).sort()) if (facetOn(st, k)) out[k] = st[k];
  return Object.keys(out).length ? JSON.stringify(out) : "";
}

/** The state back from a URL (anything malformed is dropped, never thrown). */
function facetDecode(s) {
  let o;
  try { o = JSON.parse(s); } catch (e) { return {}; }
  if (!o || typeof o !== "object" || Array.isArray(o)) return {};
  const out = {};
  for (const [k, v] of Object.entries(o)) {
    if (!/^[a-z][a-z_]{0,23}$/.test(k)) continue; // also keeps out __proto__
    if (Array.isArray(v)) { const vals = v.filter((x) => typeof x === "string" || typeof x === "number").map(String).slice(0, 50); if (vals.length) out[k] = vals; }
    else if (typeof v === "string" && v) out[k] = v.slice(0, 40);
    else if (v === true) out[k] = true;
  }
  return out;
}

/** A filter-language clause for a value (the connection filter): strings quoted. */
function filterClause(field, op, v) {
  if (typeof v === "number" || /^\d+(\.\d+)?$/.test(String(v))) return `${field} ${op} ${v}`;
  return `${field} ${op} "${String(v).replace(/\\/g, "\\\\").replace(/"/g, '\\"')}"`;
}

/** Appends a clause to a query with `and`, unless the query already holds exactly it. */
function addClause(q, clause) {
  const cur = (q || "").trim();
  if (!cur) return clause;
  if (hasClause(cur, clause)) return cur;
  return `${cur} and ${clause}`;
}

const clauses = (q) => ((q || "").trim() ? q.trim().split(/\s+and\s+/i).map((c) => c.trim()) : []);
const hasClause = (q, clause) => clauses(q).includes(clause);
/** Removes the clause when the query holds it, adds it otherwise. */
const toggleClause = (q, clause) => (hasClause(q, clause) ? clauses(q).filter((c) => c !== clause).join(" and ") : addClause(q, clause));

/** Points in about the same place (one city) become one cluster: summed weight, the
 *  heaviest item first. `prec` is the coordinate rounding in degrees. */
function clusterPoints(items, prec = 0.25) {
  const groups = new Map();
  for (const it of items) {
    const key = `${Math.round(it.lat / prec)},${Math.round(it.lon / prec)}`;
    let g = groups.get(key);
    if (!g) { g = { key, lat: 0, lon: 0, weight: 0, items: [] }; groups.set(key, g); }
    g.items.push(it); g.weight += it.weight || 0;
  }
  for (const g of groups.values()) {
    g.items.sort((a, b) => (b.weight || 0) - (a.weight || 0));
    // The heaviest item's own coordinates (a real city), not an average in the sea.
    g.lat = g.items[0].lat; g.lon = g.items[0].lon;
  }
  return [...groups.values()].sort((a, b) => b.weight - a.weight);
}

/** Places labels without overlaps. Items: { id, x, y, r, w, h, prio, always }, in map
 *  units at the current zoom; each tries right, left, above and below its dot and is
 *  dropped when all four collide with a placed label or a dot, or lie outside `view`
 *  ({x, y, w, h}); `always` labels are placed first and never dropped. `max` limits
 *  the labels that are not `always`. Returns
 *  { id: {x, y} } (the top-left corner) for the labels to show. */
function placeLabels(items, view, max = Infinity) {
  const boxes = [];
  const dots = items.map((it) => ({ x: it.x - it.r, y: it.y - it.r, w: 2 * it.r, h: 2 * it.r, id: it.id }));
  const hit = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
  const inside = (b) => b.x >= view.x && b.y >= view.y && b.x + b.w <= view.x + view.w && b.y + b.h <= view.y + view.h;
  const order = items.slice().sort((a, b) => (b.always ? 1 : 0) - (a.always ? 1 : 0) || b.prio - a.prio);
  const out = {};
  let shown = 0;
  for (const it of order) {
    if (!it.always && shown >= max) continue;
    const g = it.r * 0.4 + it.h * 0.15;
    const cand = [
      { x: it.x + it.r + g, y: it.y - it.h / 2 },
      { x: it.x - it.r - g - it.w, y: it.y - it.h / 2 },
      { x: it.x - it.w / 2, y: it.y - it.r - g - it.h },
      { x: it.x - it.w / 2, y: it.y + it.r + g },
    ];
    for (const c of cand) {
      const b = { x: c.x, y: c.y, w: it.w, h: it.h };
      if (!inside(b) || boxes.some((o) => hit(o, b)) || dots.some((d) => d.id !== it.id && hit(d, b))) continue;
      boxes.push(b); out[it.id] = { x: c.x, y: c.y };
      if (!it.always) shown++;
      break;
    }
    // The exit and VPN labels are always shown: to the right, whatever they cover.
    if (it.always && !out[it.id]) { const c = cand[0]; boxes.push({ x: c.x, y: c.y, w: it.w, h: it.h }); out[it.id] = { x: c.x, y: c.y }; }
  }
  return out;
}

/** The bar: one drop-down per multi filter (values with counts), drop-downs for choices,

function facetBar(key, defs, rows, server, lead = "") {
  const st = facetState(key);

    if (d.kind === "multi") {

      const list = all.filter((o) => o.v !== "" && !chosen.has(o.v.toLowerCase())).slice(0, 80);

    } else if (d.kind === "pick") {
      const cur = st[d.id] || "";
      parts.push(`<select class="fsel ${cur ? "on" : ""}" data-fv="${key}" data-fpick="${d.id}" aria-label="${esc(d.label)}"><option value="">${esc(d.label)}: ${t("fb_any")}</option>${d.options.map((o) => `<option value="${esc(o.v)}"${o.v === cur ? " selected" : ""}>${esc(d.label)}: ${esc(o.label)}</option>`).join("")}</select>`);
    } else if (d.kind === "flag") {
      parts.push(`<button type="button" class="fchip ${st[d.id] ? "on" : ""}" data-fv="${key}" data-fflag="${d.id}" aria-pressed="${st[d.id] ? "true" : "false"}">${esc(d.label)}</button>`);

  }

  return `<div class="fbar">${lead}${parts.join("")}${reset}</div>${chips.length ? `<div class="fchips">${chips.join("")}</div>` : ""}`;
}

  renderView(true);
});

// ================= network path =================

function vpnTunnels(np) {
  // CDN/anycast peers of a VPN client (push services, telemetry) are not its tunnel server.
  return np.vpn.map((x) => ({ ...x, servers: x.servers.filter((s) => !(s.geo && s.geo.anycast)) })).filter((x) => x.servers.length);
}

function pathChain(np, compact) {
  const box = (title, icon, body, tone = "bg-white") => `<div class="min-w-[200px] flex-1 rounded-lg border border-[#e3e6eb] ${tone} px-3 py-2"><div class="mb-1 flex items-center gap-1.5 text-[11px] font-semibold uppercase tracking-wide text-slate-500">${icon} ${title}</div>${body}</div>`;
  const pc = box(t("step_pc"), "🖥", `<div>${esc(np.interface)}</div><div class="mono text-[12px] text-slate-500">${np.local_ips.filter((x) => !x.startsWith("fe80")).map(esc).join(", ") || "—"}</div>`);
  const tunnels = vpnTunnels(np);
  const vpn = tunnels.length ? box(t("step_vpn"), "🔒", tunnels.map((x) => `<div class="mb-1"><span class="font-medium">${esc(x.process)}</span> <span class="num text-[11px] text-slate-400">pid ${x.pid}</span>
      ${x.servers.slice(0, compact ? 1 : 4).map((sv) => `<div class="mono text-[12px]">${esc(sv.addr)} <span class="font-sans">${geoLine(sv.geo, "")}</span></div><div class="text-[11px] text-slate-500">${sv.geo && sv.geo.org ? esc(sv.geo.org) : ""}</div>`).join("")}</div>`).join(""), "bg-amber-50/60") : "";
  let eg;
  if (np.egress) {
    const e = np.egress;
    eg = box(t("step_exit"), "🌐", `<div class="mono text-[14px] font-semibold">${esc(e.ip)}</div><div>${geoLine(e.geo)}</div><div class="text-[12px] text-slate-500">${e.geo && e.geo.org ? esc(e.geo.org) : ""}${e.colo ? " · " + t("cf_sees", { c: esc(e.colo) }) : ""}</div>`, "bg-sky-50/60");
  } else {
    eg = box(t("step_exit"), "🌐", `<div class="text-slate-500">${np.egress_enabled ? (np.egress_error ? t("exit_unknown", { e: esc(np.egress_error) }) : t("exit_pending")) : t("exit_off")}</div>`);
  }
  const top = np.countries.slice(0, 4).map((c) => `${cc(c.code)} ${esc(countryName(c))}`).join(" ");
  const dst = box(t("step_dst"), "🎯", `<div>${top || `<span class="text-slate-400">${t("no_data")}</span>`}</div><div class="text-[12px] text-slate-500">${np.countries.length} ${t("countries_n")}</div>`);
  const arrow = '<div class="arrow">→</div>';
  const note = np.interface_is_tunnel ? `<div class="mt-2 text-[12px] text-slate-500">${t("tunnel_note")}${tunnels.length ? t("tunnel_note2") : ""}</div>` : "";
  return `<div class="flex flex-wrap items-stretch gap-2">${pc}${arrow}${vpn ? vpn + arrow : ""}${eg}${arrow}${dst}</div>${note}`;
}

    </div>`;
}

// ================= processes =================

function groupProcesses(list) {
  const groups = new Map();
  for (const p of list) {
    const g = groups.get(p.name) || { name: p.name, path: p.path, items: [], bytes_in: 0, bytes_out: 0, active: 0, total: 0, remotes: new Map(), protocols: new Set(), last_us: 0, sig: null };
    g.items.push(p); g.bytes_in += p.bytes_in; g.bytes_out += p.bytes_out; g.active += p.connections_active; g.total += p.connections_total;
    g.path = g.path || p.path; g.last_us = Math.max(g.last_us, p.last_us); g.sig = g.sig || p;
    p.protocols.forEach((x) => g.protocols.add(x));
    p.top_remotes.forEach((x, i) => g.remotes.set(x, (g.remotes.get(x) || 0) + 5 - i));
    groups.set(p.name, g);
  }
  return [...groups.values()].sort((a, b) => (b.bytes_in + b.bytes_out) - (a.bytes_in + a.bytes_out));
}

function viewProcesses(s) {
  const pv = s.processes;
  const all = groupProcesses(pv.processes);
  const defs = processDefs(s), q = ui.procQuery.trim().toLowerCase();
  learnCountries(s.hosts.map((h) => h.geo));
  const list = facetFilter(facetState("processes"), defs, all).filter((g) => !q || g.name.toLowerCase().includes(q) || (g.path || "").toLowerCase().includes(q));
  const max = Math.max(1, ...list.map((g) => g.bytes_in + g.bytes_out));
  let rows = "";
  for (const g of list) {
    const open = ui.expanded.has(g.name);
    const single = g.items.length === 1 ? g.items[0] : null;
    const remotes = [...g.remotes.entries()].sort((a, b) => b[1] - a[1]).slice(0, 3).map((x) => esc(x[0])).join(", ");
    rows += `<tr class="clickable" ${single ? `data-pid="${single.pid}"` : `data-group="${esc(g.name)}"`}>
      <td class="max-w-[360px]"><div class="flex items-center gap-2"><span class="w-3 text-slate-400">${single ? "" : open ? "▾" : "▸"}</span>
        <div class="min-w-0"><div class="truncate"><span class="font-semibold">${esc(g.name)}</span> ${single ? `<span class="num text-[11px] text-slate-400">pid ${single.pid}</span>` : `<span class="text-[11px] text-slate-400">${t("n_procs", { n: g.items.length })}</span>`}</div>
        <div class="mono truncate text-[11px] text-slate-400" title="${esc(g.path)}">${esc(g.path || t("path_na"))}</div></div></div></td>
      <td class="max-w-[220px] truncate">${fcell("sig", g.sig.signature ? g.sig.signature.status : "pending", sigBadge(g.sig))}</td>
      <td>${[...g.protocols].map((p) => fcell("proto", p, chip(p))).join(" ")}</td>
      <td class="max-w-[260px] truncate text-slate-600">${remotes || "—"}</td>
      <td class="r num">${fmtNum(g.active)} <span class="text-slate-400">/ ${fmtNum(g.total)}</span></td>
      <td class="r num text-sky-700">${fmtBytes(g.bytes_in)}</td><td class="r num text-violet-700">${fmtBytes(g.bytes_out)}</td>
      <td class="w-24">${bar((g.bytes_in + g.bytes_out) / max)}</td>
      <td class="r num text-slate-500">${ago(s.now, Math.floor(g.last_us / 1e6))}</td></tr>`;
    if (!single && open) {
      for (const p of g.items.sort((a, b) => (b.bytes_in + b.bytes_out) - (a.bytes_in + a.bytes_out))) {
        rows += `<tr class="clickable bg-slate-50/60" data-pid="${p.pid}">
          <td class="pl-10 text-[12px]"><span class="num">pid ${p.pid}</span> <span class="text-slate-400">← ${p.parent_name ? esc(p.parent_name) + " " : ""}${p.parent ? "pid " + p.parent : ""}</span></td><td></td>
          <td>${p.protocols.map(chip).join(" ")}</td><td class="max-w-[260px] truncate text-[12px] text-slate-500">${p.top_remotes.slice(0, 3).map(esc).join(", ") || "—"}</td>
          <td class="r num text-[12px]">${fmtNum(p.connections_active)} <span class="text-slate-400">/ ${fmtNum(p.connections_total)}</span></td>
          <td class="r num text-[12px] text-sky-700">${fmtBytes(p.bytes_in)}</td><td class="r num text-[12px] text-violet-700">${fmtBytes(p.bytes_out)}</td><td></td>
          <td class="r num text-[12px] text-slate-500">${ago(s.now, Math.floor(p.last_us / 1e6))}</td></tr>`;
      }
    }
  }
  if (pv.unattributed.connections && !facetCount(facetState("processes")) && !q) {
    rows += `<tr class="clickable" data-pid="0"><td colspan="4" class="text-slate-500">${t("no_proc_row")} <span class="text-[11px] text-slate-400">${t("no_proc_hint")}</span></td>
      <td class="r num">${fmtNum(pv.unattributed.connections)}</td><td class="r num text-sky-700">${fmtBytes(pv.unattributed.bytes_in)}</td><td class="r num text-violet-700">${fmtBytes(pv.unattributed.bytes_out)}</td><td></td><td></td></tr>`;
  }
  const note = !pv.attribution_enabled ? `<div class="border-b border-[#e3e6eb] bg-slate-50 px-4 py-2 text-slate-500">${t("attr_file")}</div>`
    : pv.attribution_error ? `<div class="border-b border-amber-200 bg-amber-50 px-4 py-2 text-amber-800">${t("attr_partial", { e: esc(pv.attribution_error) })}</div>` : "";
  const fbar = facetBar("processes", defs, all, null, `<input id="proc-q" type="search" class="input w-56" value="${esc(ui.procQuery)}" placeholder="${esc(t("proc_ph"))}" autocomplete="off">`);
  return kpis(s) + panel(`${t("processes")} <span class="sub">· ${shownOf(list.length, all.length)} · ${t("proc_hint")}</span>`, `${fbar}${note}<div class="scroll max-h-[70vh]"><table class="grid-table">
    <thead><tr><th>${t("program")}</th><th>${t("signature")}</th><th>${t("protocols")}</th><th>${t("goes_to")}</th><th class="r">${t("connections")}</th><th class="r">${t("received")}</th><th class="r">${t("sent")}</th><th>${t("share")}</th><th class="r">${t("activity")}</th></tr></thead>
    <tbody>${rows || empty(9, all.length ? t("nothing") : t("no_attr_yet"))}</tbody></table></div>`, "", `<a class="btn" href="/api/export/processes.csv">${t("export_csv")}</a>`);
}

function qualityCell(c) {
  if (c.rtt_ms === null || c.rtt_ms === undefined) return '<span class="text-slate-300">—</span>';
  const cls = c.rtt_ms > 250 ? "text-red-600" : c.rtt_ms > 100 ? "text-amber-600" : "text-emerald-700";
  return `<span class="num ${cls}">${fmtMs(c.rtt_ms)}</span>`;
}

  return list.map((c) => {

async function loadWorld() {
  if (worldRings || worldFailed || loadWorld.pending) return;
  loadWorld.pending = true;
  try {
    const r = await fetch("/static/land-110m.json");
    worldRings = decodeTopo(await r.json());
  } catch (e) { worldFailed = true; }
  loadWorld.pending = false;
  if (route.name === "map" || route.name === "route" || route.name === "conn") renderView();
}

/** TopoJSON → rings of [lon, lat] (delta-encoded quantized arcs). */
function decodeTopo(topo) {
  const [sx, sy] = topo.transform.scale, [tx, ty] = topo.transform.translate;
  const arcs = topo.arcs.map((arc) => { let x = 0, y = 0; return arc.map(([dx, dy]) => { x += dx; y += dy; return [x * sx + tx, y * sy + ty]; }); });
  const arcPts = (i) => (i >= 0 ? arcs[i] : arcs[~i].slice().reverse());
  const rings = [];
  const poly = (p) => p.forEach((ring) => { const pts = []; ring.forEach((i) => { const a = arcPts(i); pts.push(...(pts.length ? a.slice(1) : a)); }); rings.push(pts); });
  const walk = (g) => { if (g.type === "GeometryCollection") g.geometries.forEach(walk); else if (g.type === "Polygon") poly(g.arcs); else if (g.type === "MultiPolygon") g.arcs.forEach(poly); };
  Object.values(topo.objects).forEach(walk);
  return rings;
}

const MAP_W = 1000, MAP_H = 470, LAT_TOP = 84, LAT_BOTTOM = -58;
const proj = (lon, lat) => [((lon + 180) / 360) * MAP_W, ((LAT_TOP - lat) / (LAT_TOP - LAT_BOTTOM)) * MAP_H];
const hasCoords = (g) => g && g.lat !== null && g.lat !== undefined && g.lon !== null && g.lon !== undefined;

// ----- zoomable map -----
// The viewport is an SVG viewBox kept in ui.mapViews[key] (null = whole world). Wheel,
// drag, pinch, double-click and the +/−/⟲ buttons change it in place (applyMapView), so
// the periodic re-render only has to draw the same viewport again.
// Labels that are not "always" shown: this many per zoom step (×1 → 8, ×4 → 32…), the rest
// only in tooltips; `placeLabels` drops the ones that would overlap.
const MAP_MAX_ZOOM = 40, LABELS_PER_ZOOM = 8, MAX_LABELS = 150;

  // Rings crossing the antimeridian jump from +180 to -180: start a new subpath there
  // instead of drawing a line across the whole map.
  if (landPath === null && worldRings) landPath = worldRings.map((r) => r.map(([lo, la], i) => (i === 0 || Math.abs(lo - r[i - 1][0]) > 180 ? "M" : "L") + proj(lo, la).map((v) => v.toFixed(1)).join(",")).join("")).join("");
  return landPath || "";
}
const mapView = (key) => ui.mapViews[key] || { x: 0, y: 0, w: MAP_W, h: MAP_H };
const mapZoom = (key) => MAP_W / mapView(key).w;
function clampView(v) {
  const w = Math.min(MAP_W, Math.max(MAP_W / MAP_MAX_ZOOM, v.w)), h = w * MAP_H / MAP_W;
  return { x: Math.min(MAP_W - w, Math.max(0, v.x)), y: Math.min(MAP_H - h, Math.max(0, v.y)), w, h };
}
/** Zooms by `factor` keeping the map point under (fx, fy) (fractions of the viewport) still. */
function zoomView(key, factor, fx = 0.5, fy = 0.5) {
  const v = mapView(key), w = v.w * factor, h = v.h * factor;
  const nv = clampView({ x: v.x + fx * (v.w - w), y: v.y + fy * (v.h - h), w, h });
  ui.mapViews[key] = nv.w >= MAP_W - 0.01 ? null : nv;
}
function panView(key, dx, dy) {
  const v = mapView(key);
  ui.mapViews[key] = clampView({ x: v.x + dx, y: v.y + dy, w: v.w, h: v.h });
}
/** Re-applies the stored viewport to a rendered map without rebuilding the page. */
function applyMapView(wrap) {
  const key = wrap.dataset.map, v = mapView(key), k = mapZoom(key);
  const svg = wrap.querySelector("svg");
  svg.setAttribute("viewBox", `${v.x.toFixed(2)} ${v.y.toFixed(2)} ${v.w.toFixed(2)} ${v.h.toFixed(2)}`);
  // Dots shrink slower than the map grows, so they stay visible but stop covering cities.
  svg.querySelectorAll("circle[data-r]").forEach((c) => c.setAttribute("r", (Number(c.dataset.r) / Math.sqrt(k)).toFixed(2)));
  layoutLabels(wrap);
  const z = wrap.querySelector(".map-zoom");
  if (z) z.textContent = "×" + (k < 10 ? k.toFixed(1) : k.toFixed(0));
}
/** Shows the labels of a rendered map that fit (see placeLabels) at its current zoom. Text
 *  widths are measured once per render, at zoom ×1 units, and scaled afterwards. */
function layoutLabels(wrap) {
  const key = wrap.dataset.map, v = mapView(key), k = mapZoom(key), fs = 11 / k;
  const items = [...wrap.querySelectorAll(".map-label")].map((el) => {
    el.setAttribute("font-size", fs.toFixed(2));
    if (!el.dataset.wu) {
      el.style.display = "";
      let len = 0;
      try { len = el.getComputedTextLength(); } catch (e) { /* not rendered */ }
      el.dataset.wu = String(len > 0 ? len * k : el.textContent.length * 6.4);
    }
    return { id: el.dataset.li, el, x: Number(el.dataset.lx), y: Number(el.dataset.ly), r: Number(el.dataset.lr) / Math.sqrt(k), w: Number(el.dataset.wu) / k, h: fs * 1.2, prio: Number(el.dataset.prio), always: !!el.dataset.always };
  });
  const placed = placeLabels(items, v, Math.round(LABELS_PER_ZOOM * k));
  for (const it of items) {
    const p = placed[it.id];
    if (!p) { it.el.style.display = "none"; continue; }
    it.el.style.display = "";
    it.el.setAttribute("x", p.x.toFixed(2));
    it.el.setAttribute("y", (p.y + it.h * 0.8).toFixed(2));
  }
}

function worldSvg(points, lines, extra = "", key = "world") {
  const v = mapView(key), k = mapZoom(key);
  let grid = "";
  for (let lo = -150; lo <= 180; lo += 30) { const [x] = proj(lo, 0); grid += `M${x.toFixed(1)},0V${MAP_H}`; }
  for (let la = -60; la <= 60; la += 30) { const [, y] = proj(0, la); grid += `M0,${y.toFixed(1)}H${MAP_W}`; }
  const ln = lines.map(([a, b, color]) => { const [x1, y1] = proj(a.lon, a.lat), [x2, y2] = proj(b.lon, b.lat); return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${color}" stroke-width="1" stroke-opacity=".35"/>`; }).join("");
  const pts = points.map((p) => { const [x, y] = proj(p.lon, p.lat); return `<circle class="map-dot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(Number(p.r) / Math.sqrt(k)).toFixed(2)}" data-r="${p.r}" fill="${p.color}" fill-opacity=".75" stroke="#fff" stroke-width="1" ${p.attr || ""}><title>${esc(p.title)}</title></circle>`; }).join("");
  // Labels are placed after rendering (layoutLabels): where they fit, the most important first.
  const labelled = points.filter((p) => p.label && p.always).concat(points.filter((p) => p.label && !p.always).sort((a, b) => Number(b.prio ?? b.r) - Number(a.prio ?? a.r)).slice(0, MAX_LABELS));
  const labels = labelled.map((p, i) => { const [x, y] = proj(p.lon, p.lat); return `<text class="map-label" data-li="${i}" data-lx="${x.toFixed(2)}" data-ly="${y.toFixed(2)}" data-lr="${p.r}" data-prio="${Number(p.prio ?? p.r)}" ${p.always ? 'data-always="1"' : ""} x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-size="${(11 / k).toFixed(2)}" style="display:none">${esc(p.label)}</text>`; }).join("");
  const btn = (z, label, text) => `<button type="button" data-map-zoom="${z}" title="${esc(label)}" aria-label="${esc(label)}">${text}</button>`;
  return `<div class="map-wrap" data-map="${key}" title="${esc(t("map_drag_hint"))}"><svg class="map-svg" viewBox="${v.x.toFixed(2)} ${v.y.toFixed(2)} ${v.w.toFixed(2)} ${v.h.toFixed(2)}" preserveAspectRatio="xMidYMid meet" aria-label="map"><rect x="0" y="0" width="${MAP_W}" height="${MAP_H}" fill="#f8fafc"/><path class="map-grid" d="${grid}"/><path class="map-land" d="${worldPath()}"/>${ln}${extra}${pts}${labels}</svg>
    <div class="map-ctl">${btn("in", t("map_zoom_in"), "+")}${btn("out", t("map_zoom_out"), "−")}${btn("reset", t("map_reset"), "⟲")}</div><div class="map-zoom">×${k < 10 ? k.toFixed(1) : k.toFixed(0)}</div></div>`;
}

// Map interaction: wheel zoom at the cursor, drag to pan, pinch on touch screens.
function mapPointer(ev, wrap) {
  const r = wrap.querySelector("svg").getBoundingClientRect();
  return { fx: (ev.clientX - r.left) / r.width, fy: (ev.clientY - r.top) / r.height, rect: r };
}
$("view").addEventListener("wheel", (ev) => {
  const wrap = ev.target.closest && ev.target.closest(".map-wrap");
  if (!wrap) return;
  ev.preventDefault();
  const { fx, fy } = mapPointer(ev, wrap);
  zoomView(wrap.dataset.map, ev.deltaY < 0 ? 0.8 : 1.25, fx, fy);
  applyMapView(wrap);
}, { passive: false });
$("view").addEventListener("dblclick", (ev) => {
  const wrap = ev.target.closest && ev.target.closest(".map-wrap");
  if (!wrap || ev.target.closest(".map-ctl")) return;
  const { fx, fy } = mapPointer(ev, wrap);
  zoomView(wrap.dataset.map, 0.5, fx, fy);
  applyMapView(wrap);
});
$("view").addEventListener("pointerdown", (ev) => {
  const wrap = ev.target.closest && ev.target.closest(".map-wrap");
  if (!wrap || ev.target.closest(".map-ctl") || (ev.pointerType === "mouse" && ev.button !== 0)) return;
  const d = ui.mapDrag && ui.mapDrag.wrap === wrap ? ui.mapDrag : { wrap, key: wrap.dataset.map, pointers: new Map(), moved: false };
  d.pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  d.start = mapView(d.key);
  d.origin = [...d.pointers.values()];
  ui.mapDrag = d;
  wrap.querySelector("svg").classList.add("dragging");
  try { wrap.setPointerCapture(ev.pointerId); } catch (e) { /* not supported */ }
});
$("view").addEventListener("pointermove", (ev) => {
  const d = ui.mapDrag;
  if (!d || !d.pointers.has(ev.pointerId)) return;
  d.pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  const now = [...d.pointers.values()], rect = d.wrap.querySelector("svg").getBoundingClientRect();
  const unit = d.start.w / rect.width; // map units per CSS pixel at drag start
  if (now.length >= 2 && d.origin.length >= 2) {
    // Pinch: scale by the change of distance, keep the midpoint still.
    const dist = (p) => Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
    const scale = dist(d.origin) / Math.max(1, dist(now));
    const mid0 = { x: (d.origin[0].x + d.origin[1].x) / 2, y: (d.origin[0].y + d.origin[1].y) / 2 }, mid = { x: (now[0].x + now[1].x) / 2, y: (now[0].y + now[1].y) / 2 };
    const w = d.start.w * scale, h = d.start.h * scale;
    const mx = d.start.x + (mid0.x - rect.left) * unit, my = d.start.y + (mid0.y - rect.top) * unit;
    const nv = clampView({ x: mx - (mid.x - rect.left) / rect.width * w, y: my - (mid.y - rect.top) / rect.height * h, w, h });
    ui.mapViews[d.key] = nv.w >= MAP_W - 0.01 ? null : nv;
  } else {
    const dx = (now[0].x - d.origin[0].x), dy = (now[0].y - d.origin[0].y);
    if (Math.abs(dx) + Math.abs(dy) > 3) d.moved = true;
    ui.mapViews[d.key] = clampView({ x: d.start.x - dx * unit, y: d.start.y - dy * unit, w: d.start.w, h: d.start.h });

});
function mapDragEnd(ev) {
  const d = ui.mapDrag;

  d.pointers.delete(ev.pointerId);
  if (d.pointers.size) { d.start = mapView(d.key); d.origin = [...d.pointers.values()]; return; }
  d.wrap.querySelector("svg").classList.remove("dragging");
  ui.mapDrag = null;
  // A drag must not count as a click on the dot under the pointer (on touch screens the
  // click can arrive a task later, so a one-shot capturing listener eats it, not a timer).
  if (d.moved) {
    const swallow = (ev2) => { if (ev2.target.closest && ev2.target.closest(".map-wrap")) { ev2.stopPropagation(); ev2.preventDefault(); } };
    document.addEventListener("click", swallow, { capture: true, once: true });
    setTimeout(() => document.removeEventListener("click", swallow, { capture: true }), 500);

  if (ui.renderPending) { ui.renderPending = false; renderView(); }

$("view").addEventListener("pointerup", mapDragEnd);
$("view").addEventListener("pointercancel", mapDragEnd);

function viewMap(s) {
  loadWorld();

  const eg = np.egress && hasCoords(np.egress.geo) ? np.egress.geo : null;
  const defs = mapDefs(s), st = facetState("map"), filtered = facetCount(st) > 0;
  learnCountries(s.hosts.map((h) => h.geo));
  const hosts = facetFilter(st, defs, s.hosts);
  const total = (h) => h.bytes_in + h.bytes_out;
  // Hosts in one city share a dot: its size is their traffic, its label the city and count.
  const clusters = clusterPoints(hosts.filter((h) => hasCoords(h.geo)).map((h) => ({ lat: h.geo.lat, lon: h.geo.lon, weight: total(h), host: h })));
  const maxW = Math.max(1, ...clusters.map((c) => c.weight));
  const points = [], lines = [];
  for (const c of clusters) {
    const h0 = c.items[0].host, g = h0.geo, n = c.items.length;
    const color = c.items.every((i) => anycastOf(i.host)) ? "#94a3b8" : "#2563eb";
    const place = placeText(g) || g.country_code || "";
    const title = n === 1 ? `${h0.name || h0.ip}\n${place}\n${g.org || ""}\n${fmtBytes(c.weight)}`
      : `${place} — ${t("map_n_hosts", { n })}, ${fmtBytes(c.weight)}\n${c.items.slice(0, 8).map((i) => `• ${i.host.name || i.host.ip} — ${fmtBytes(i.weight)}`).join("\n")}${n > 8 ? "\n…" : ""}`;
    points.push({ lat: c.lat, lon: c.lon, r: (3 + 14 * Math.sqrt(c.weight / maxW)).toFixed(1), color, title, prio: c.weight,
      attr: n === 1 ? `data-host="${esc(h0.ip)}"` : `data-mapcluster="${esc(c.key)}"`,
      label: n === 1 ? h0.name || h0.ip : `${gName(g, "city") || gName(g, "country") || g.country_code} · ${n}` });
    if (eg) lines.push([eg, c, color]);
  }
  for (const x of vpnTunnels(np)) for (const sv of x.servers) if (hasCoords(sv.geo)) points.push({ lat: sv.geo.lat, lon: sv.geo.lon, r: 7, color: "#f59e0b", title: `${t("map_vpn")}: ${sv.addr}\n${x.process}`, label: `VPN · ${x.process}`, always: true });
  if (eg) points.push({ lat: eg.lat, lon: eg.lon, r: 8, color: "#16a34a", title: `${t("map_egress")}: ${np.egress.ip}\n${placeText(eg)}`, label: `${t("map_egress")} · ${placeText(eg) || np.egress.ip}`, always: true });
  const dot = (c) => `<span class="inline-block h-2.5 w-2.5 rounded-full" style="background:${c}"></span>`;
  const legend = `<div class="flex flex-wrap gap-4 px-4 py-2 text-[12px] text-slate-500"><span>${dot("#16a34a")} ${t("map_egress")}</span><span>${dot("#f59e0b")} ${t("map_vpn")}</span><span>${dot("#2563eb")} ${t("map_host")}</span><span>${dot("#94a3b8")} ${t("map_anycast")}</span><span class="ml-auto">${t("map_drag_hint")}</span>${worldFailed ? `<span class="text-amber-700">${t("map_offline")}</span>` : ""}</div>`;
  // The opened cluster: its hosts, each leading to its connections.
  const open = ui.mapCluster && clusters.find((c) => c.key === ui.mapCluster);
  const here = open ? panel(`${t("map_here")} <span class="sub">· ${esc(placeText(open.items[0].host.geo) || open.items[0].host.geo.country_code || "")} · ${t("map_n_hosts", { n: open.items.length })}</span>`,
    `<table class="grid-table"><tbody>${open.items.map((i) => `<tr class="clickable" data-host="${esc(i.host.ip)}"><td class="max-w-[260px] truncate"><span class="font-medium">${esc(i.host.name || i.host.ip)}</span> <span class="mono text-[11px] text-slate-400">${esc(i.host.ip)}</span></td><td class="text-[12px]">${orgLine(i.host.geo)}</td><td class="max-w-[200px] truncate text-[12px] text-slate-500">${(i.host.processes || []).map(esc).join(", ")}</td><td class="r num">${fmtBytes(i.weight)}</td></tr>`).join("")}</tbody></table>`, "mb-4", `<button class="btn" data-mapcluster="">✕</button>`) : "";
  // Countries of the hosts shown (the server's full list when nothing is filtered); a click
  // toggles the country filter.
  let countries = np.countries.map((c) => ({ code: c.code, label: countryName(c), hosts: c.hosts, bytes: c.bytes }));
  if (filtered) {
    const m = new Map();
    for (const h of hosts) {
      const g = h.geo, code = g && g.country_code;
      if (!code) continue;
      const x = m.get(code) || { code, label: gName(g, "country") || code, hosts: 0, bytes: 0 };
      x.hosts++; x.bytes += total(h); m.set(code, x);
    }
    for (const code of st.country || []) if (!m.has(code)) m.set(code, { code, label: countryLabel(code), hosts: 0, bytes: 0 });
    countries = [...m.values()].sort((a, b) => b.bytes - a.bytes);
  }
  const chosen = new Set((st.country || []).map((c) => String(c).toUpperCase()));
  const maxC = Math.max(1, ...countries.map((c) => c.bytes));
  const ctable = `<table class="grid-table"><tbody>${countries.map((c) => `<tr class="clickable ${chosen.has(c.code.toUpperCase()) ? "bg-blue-50" : ""}" data-ftog="country" data-v="${esc(c.code)}" title="${esc(t("fb_click"))}"><td>${cc(c.code)} ${esc(c.label)}</td><td class="r num text-slate-500">${c.hosts} ${t("hosts_n")}</td><td class="w-1/3">${bar(c.bytes / maxC, "#0ea5e9")}</td><td class="r num">${fmtBytes(c.bytes)}</td></tr>`).join("") || empty(4, np.geo ? t("no_ext") : t("geo_off"))}</tbody></table>`;
  return `${panel(`${t("map")} <span class="sub">· ${filtered ? shownOf(hosts.length, s.hosts.length) + " · " : ""}${t("map_hint")}</span>`, facetBar("map", defs, s.hosts) + worldSvg(points, lines) + legend, "mb-4")}
    ${here}${panel(t("countries"), ctable)}`;
}

// ================= route, tracing, watch =================

function traceMap(tr) {
  const pts = (tr.hops || []).filter((h) => hasCoords(h.geo));
  if (!pts.length) return "";
  loadWorld();
  const path = pts.map((h, i) => { const [x, y] = proj(h.geo.lon, h.geo.lat); return (i ? "L" : "M") + x.toFixed(1) + "," + y.toFixed(1); }).join("");
  const points = pts.map((h) => ({ lat: h.geo.lat, lon: h.geo.lon, r: 5, color: h.ip === tr.target ? "#16a34a" : "#2563eb", title: `#${h.ttl} ${h.ip}\n${h.geo.org || ""}\n${placeText(h.geo)}`, label: `#${h.ttl} ${placeText(h.geo) || h.ip}` }));
  return `<div class="border-b border-[#eef0f3]">${worldSvg(points, [], `<path d="${path}" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 4"/>`, "trace")}</div>`;
}

function traceTable(tr) {
  if (tr.error) return `<div class="px-4 py-6 text-center text-red-700">${esc(tr.error)}</div>`;
  const maxRtt = Math.max(1, ...tr.hops.flatMap((h) => h.rtt_ms.filter((x) => x !== null)));
  let prev = null;
  const rows = tr.hops.map((h) => {
    const rtts = h.rtt_ms.filter((x) => x !== null);
    const best = rtts.length ? Math.min(...rtts) : null;
    const c = h.geo && h.geo.country_code;
    const border = c && prev && c !== prev ? `<span class="chip bg-amber-100 text-amber-800">${t("border", { a: esc(prev), b: esc(c) })}</span>` : "";
    if (c) prev = c;
    const dot = !h.ip ? "#cbd5e1" : h.private ? "#f59e0b" : h.ip === tr.target ? "#16a34a" : "#2563eb";
    return `<tr><td class="relative w-10"><div class="hopline"></div><div class="relative z-[1] mx-auto flex h-6 w-6 items-center justify-center rounded-full text-[11px] font-semibold text-white" style="background:${dot}">${h.ttl}</div></td>
      <td>${h.ip ? `<div class="mono font-medium">${esc(h.ip)}</div><div class="truncate text-[11px] text-slate-500">${esc(h.name || "")}</div>` : `<span class="text-slate-400">${t("silent")}</span>`}</td>
      <td class="w-48">${best !== null ? `<div class="num text-[12px]">${h.rtt_ms.map((x) => (x === null ? "*" : x.toFixed(0) + " " + t("ms"))).join(" · ")}</div>${bar(best / maxRtt, "#10b981")}` : ""}</td>
      <td class="max-w-[220px] truncate text-[12px]">${h.private ? `<span class="text-amber-700">${t("private_net")}</span>` : orgLine(h.geo)}</td>
      <td class="whitespace-nowrap">${h.private ? "" : geoLine(h.geo)} ${border}</td></tr>`;
  }).join("");
  return `${traceMap(tr)}<div class="flex flex-wrap gap-4 border-b border-[#eef0f3] px-4 py-2 text-[12px] text-slate-500"><span>${t("trace_to")} <span class="mono text-slate-800">${esc(tr.target)}</span></span><span>${tr.reached ? `<span class="text-emerald-700">${t("reached")}</span>` : `<span class="text-amber-700">${t("not_reached")}</span>`}</span><span>${t("hops_n", { n: tr.hops.length })}</span><span>${(tr.duration_ms / 1000).toFixed(1)} ${t("s")}</span><span>${methodLabel(tr.method)}</span></div>
    <table class="grid-table"><thead><tr><th></th><th>${t("node")}</th><th>${t("delay")}</th><th>${t("provider")}</th><th>${t("where")}</th></tr></thead><tbody>${rows}</tbody></table>`;
}

async function runTrace(ip, fresh) {
  if (!ip || ui.tracing[ip]) return;
  ui.tracing[ip] = true;
  renderView();
  try { ui.traces[ip] = await getJson(`/api/trace?ip=${encodeURIComponent(ip)}${fresh ? "&fresh=true" : ""}`); }
  catch (e) { ui.traces[ip] = { error: String(e.message || e), hops: [] }; }
  delete ui.tracing[ip];
  renderView();
}

function traceBlock(ip) {
  const tr = ui.traces[ip], busy = ui.tracing[ip];
  const btn = `<button class="btn btn-primary" data-trace="${esc(ip || "")}" ${busy || !ip ? "disabled" : ""}>${busy ? t("tracing") : tr ? t("retrace") : t("trace")}</button>`;
  return { btn, body: busy && !tr ? `<div class="px-4 py-8 text-center text-slate-500">${t("trace_probe")}</div>` : tr ? traceTable(tr) : `<div class="px-4 py-8 text-center text-slate-400">${t("trace_pick")}</div>` };
}

async function refreshWatch() {
  const seq = ++ui.seq.watch;
  try { const w = await getJson("/api/watch"); if (seq === ui.seq.watch) ui.watch = w; } catch (e) { console.error(e); }
  if (seq === ui.seq.watch && (route.name === "route" || route.name === "hosts")) renderView();
}

async function watchChange(method, ip, label) {
  const qs = `ip=${encodeURIComponent(ip)}${label ? "&label=" + encodeURIComponent(label) : ""}`;
  // A slow poll must not resurrect a row removed here: this response is the newest.
  const seq = ++ui.seq.watch;
  try { const w = await getJson(`/api/watch?${qs}`, method); if (seq === ui.seq.watch) ui.watch = w; } catch (e) { console.error(e); }
  renderView();
}

function viewWatch(s) {
  const w = ui.watch;
  const rows = (w ? w.targets : []).map((x) => {
    const h = x.history[0];
    const changed = x.history.some((y) => y.changed);
    const hist = x.history.slice(0, 24).reverse().map((y) => `<span title="${esc(new Date(y.ts * 1000).toLocaleString(loc()))}: ${esc(y.path.join(" › "))} ${y.rtt_ms ? fmtMs(y.rtt_ms) : ""}" class="inline-block h-3 w-1.5 rounded-sm ${y.changed ? "bg-amber-500" : y.reached ? "bg-emerald-500" : "bg-slate-300"}"></span>`).join(" ");
    return `<tr><td><div class="mono font-medium">${esc(x.ip)}</div><div class="text-[11px] text-slate-500">${esc(x.label || "")}</div></td>
      <td class="text-[12px]">${h ? `${new Date(h.ts * 1000).toLocaleTimeString(loc(), { hour12: false })} · ${t("hops_n", { n: h.hops })} · ${h.rtt_ms ? fmtMs(h.rtt_ms) : "—"}` : x.running ? t("tracing") : "—"}<div class="text-[11px] text-slate-400">${t("next_run", { s: duration(Math.max(0, x.next_run - Date.now() / 1000)) })}</div></td>
      <td class="max-w-[360px] text-[12px]">${h ? esc(h.path.join(" › ")) : ""}${changed ? ` <span class="chip bg-amber-100 text-amber-800">${t("changed")}</span>` : ""}</td>
      <td>${hist}</td>
      <td class="r whitespace-nowrap"><button class="btn" data-trace-goto="${esc(x.ip)}">${t("route_btn")}</button> <button class="btn" data-watch-remove="${esc(x.ip)}">${t("watch_remove")}</button></td></tr>`;
  }).join("");
  return panel(`${t("watch_title")} <span class="sub">· ${t("watch_hint", { m: w ? Math.round(w.interval_secs / 60) : 10 })}</span>`,
    `<table class="grid-table"><thead><tr><th>${t("host")}</th><th>${t("last_run")}</th><th>${t("path")}</th><th>${t("history")}</th><th></th></tr></thead><tbody>${rows || empty(5, t("watch_none"))}</tbody></table>`, "mb-4",
    `<input id="watch-ip" class="input mono w-44" placeholder="${esc(t("ip_ph"))}"><button class="btn" id="watch-add">${t("watch_add")}</button>`);
}

function viewRoute(s) {
  const options = s.hosts.filter((h) => h.scope !== "local").slice(0, 40).map((h) => `<option value="${esc(h.ip)}">${esc(h.name ? h.name + " — " + h.ip : h.ip)}</option>`).join("");
  const ip = ui.routeIp;
  const tb = traceBlock(ip);
  const vpnRows = s.netpath.vpn.map((x) => x.servers.map((sv) => `<tr><td><span class="font-medium">${esc(x.process)}</span> <span class="num text-[11px] text-slate-400">${x.pid}</span></td>
      <td class="mono">${esc(sv.addr)}</td><td class="text-[12px] text-slate-500">${esc(sv.state || "")}</td><td>${geoLine(sv.geo)}</td><td class="text-[12px]">${orgLine(sv.geo)}</td>
      <td class="r"><button class="btn" data-trace-goto="${esc(sv.addr.replace(/:\d+$/, "").replace(/^\[|\]$/g, ""))}">${t("route_btn")}</button></td></tr>`).join("")).join("");
  return `${panel(t("path_title"), `<div class="p-3">${pathChain(s.netpath, false)}</div>`, "mb-4")}
    ${viewWatch(s)}
    ${s.netpath.vpn.length ? panel(`${t("vpn_conns")} <span class="sub">· ${t("vpn_hint")}</span>`, `<table class="grid-table"><thead><tr><th>${t("client")}</th><th>${t("remote_addr")}</th><th>${t("state")}</th><th>${t("where")}</th><th>${t("provider")}</th><th></th></tr></thead><tbody>${vpnRows}</tbody></table>`, "mb-4") : ""}
    ${panel(t("route"), tb.body, "", `<input id="route-ip" class="input mono w-48" list="route-hosts" placeholder="${esc(t("ip_ph"))}" value="${esc(ip)}"><datalist id="route-hosts">${options}</datalist>${tb.btn}${ip ? `<button class="btn" data-watch-add="${esc(ip)}">${t("watch_btn")}</button>` : ""}`)}
    <div class="mt-2 text-[12px] text-slate-500">${t("trace_note")}</div>`;
}

// ================= DNS =================

/** Query string of the DNS page: text, value lists (`f`), slow answers, local names. */
function dnsQs() {
  const qs = new URLSearchParams(), q = ui.dnsQuery.trim(), st = facetState("dns");
  if (q) qs.set("q", q);
  const f = serverFacets(st, dnsDefs());
  if (f) qs.set("f", f);
  if (st.slow) qs.set("slow", st.slow);
  if (st.hide_local) qs.set("hide_local", "true");
  return qs.toString();
}

async function refreshDns() {
  const seq = ++ui.seq.dns, qs = dnsQs();
  try { const d = await getJson("/api/dns?limit=500" + (qs ? "&" + qs : "")); if (seq === ui.seq.dns) ui.dnsData = d; } catch (e) { console.error(e); }
  if (route.name === "dns" && seq === ui.seq.dns && !fselOpen()) renderView();
}

function viewDns() {
  const d = ui.dnsData;
  const rcodeCls = (r) => (r === "NOERROR" ? "text-emerald-700" : r ? "text-red-600" : "text-slate-400");

  const rows = d ? d.entries.map((e) => `<tr>
      <td class="num whitespace-nowrap text-[12px] text-slate-500">${clockUs(e.ts_us)}</td>
      <td class="max-w-[300px]"><div class="mono truncate font-medium" title="${esc(e.name)}">${esc(e.name)}</div></td>
      <td class="text-[12px]">${fcell("qtype", e.qtype, esc(e.qtype))}</td><td class="text-[12px] ${rcodeCls(e.rcode)}">${fcell("rcode", e.rcode || "pending", esc(e.rcode || "…"))}</td>
      <td class="mono max-w-[220px] truncate text-[12px]" title="${esc(e.answers.join(", "))}">${e.answers.map(esc).join(", ") || dash}</td>
      <td class="r">${e.latency_ms !== null ? `<span class="num">${fmtMs(e.latency_ms)}</span>` : dash}</td>
      <td class="text-[12px]">${e.requester ? fcell("process", e.requester.name, esc(e.requester.name)) : dash}</td>
      <td class="max-w-[200px] truncate text-[12px]">${e.used_by.map(esc).join(", ") || dash}</td>
      <td class="mono text-[11px] text-slate-500">${fcell("resolver", e.resolver, esc(e.resolver))} · ${fcell("transport", e.transport, esc(e.transport))}</td></tr>`).join("") : "";
  const enc = d ? d.encrypted.map((c) => `<tr class="clickable" data-conn="${c.id}"><td>${procLabel(c.process)}</td><td><span class="chip bg-indigo-100 text-indigo-800">${esc(c.encrypted_dns)}</span></td><td class="mono text-[12px]">${esc(c.remote)}</td><td class="text-[12px]">${esc(c.name || "")}</td><td class="r num">${fmtBytes(c.bytes_in + c.bytes_out)}</td></tr>`).join("") : "";
  return `${panel(`${t("enc_dns")} <span class="sub">· ${t("enc_dns_hint")}</span>`, `<table class="grid-table"><tbody>${enc || empty(5, d ? t("enc_none") : t("loading"))}</tbody></table>`, "mb-4")}
    ${panel(`${t("dns")} <span class="sub">· ${t("dns_hint")}${d ? " · " + t("dns_stats", { q: fmtNum(d.queries), f: fmtNum(d.failures) }) + (facetCount(facetState("dns")) ? " · " + t("fb_found", { n: fmtNum(d.total) }) : "") : ""}</span>`,
      `${facetBar("dns", dnsDefs(), [], d ? d.facets : {})}<div class="scroll max-h-[70vh]"><table class="grid-table"><thead><tr><th>${t("time")}</th><th>${t("name")}</th><th>${t("type")}</th><th>${t("result")}</th><th>${t("answers")}</th><th class="r">${t("latency")}</th><th>${t("requester")}</th><th>${t("used_by")}</th><th>${t("resolver")}</th></tr></thead>
      <tbody>${d ? rows || empty(9, t("nothing")) : empty(9, t("loading"))}</tbody></table></div>`, "",
      `<input id="dns-q" type="search" class="input w-72" value="${esc(ui.dnsQuery)}" placeholder="${esc(t("dns_ph"))}" autocomplete="off"><a class="btn" href="/api/export/dns.csv${dnsQs() ? "?" + dnsQs() : ""}">${t("export_csv")}</a>`)}`;
}

function viewSockets() {
  const pid = route.params.pid;
  const q = ui.sockQuery.trim().toLowerCase();

  return panel(`${t("sockets")} <span class="sub">· ${t("sockets_hint")} · ${shownOf(list.length, all.length)}</span>`,
    `${off ? "" : facetBar("sockets", defs, all)}${sockCache && sockCache.error ? `<div class="border-b border-amber-200 bg-amber-50 px-4 py-2 text-amber-800">${esc(sockCache.error)}</div>` : ""}<div class="scroll max-h-[78vh]"><table class="grid-table">

    <tbody>${off ? empty(5, t("sock_off")) : rows || empty(5, sockCache ? t("nothing") : t("loading"))}</tbody></table></div>`, "",
    `${pidChip}<input id="sock-q" type="search" class="input w-64" value="${esc(ui.sockQuery)}" placeholder="${esc(t("sock_ph"))}" autocomplete="off">`);

async function refreshSockets() {

// ================= alerts =================

function alertItem(a) {
  const target = a.host ? `data-host="${esc(a.host)}"` : a.details && a.details.process ? `data-procname="${esc(a.details.process)}"` : "";
  return `<div class="clickable cursor-pointer px-4 py-2 hover:bg-slate-50" ${target}>
    <div class="flex items-center gap-2 text-[12px]"><span class="chip ${SEV_CLASS[a.severity] || SEV_CLASS.low}">${t("sev_" + a.severity)}</span>${catIcon(a.category)}<span class="font-medium">${t("kind_" + a.kind)}</span><span class="num ml-auto text-slate-400">${clock(a.ts)}</span></div>
    <div class="mt-0.5 break-words">${alertText(a)}</div>${a.host ? `<div class="mono text-[11px] text-slate-400">${esc(a.host)}${a.name ? " · " + esc(a.name) : ""}</div>` : ""}</div>`;
}

function viewAlerts(s) {
  const c = s.alert_counts;
  const tabs = [["all", c.total], ["high", c.high], ["medium", c.medium], ["low", c.low]];
  const defs = alertDefs(s), q = ui.alertQuery.trim().toLowerCase();
  const bySeverity = s.alerts.filter((a) => ui.alertFilter === "all" || a.severity === ui.alertFilter);
  const items = facetFilter(facetState("alerts"), defs, bySeverity).filter((a) => !q || [a.message, a.host, a.name, t("kind_" + a.kind), ...Object.values(a.details || {})].some((x) => String(x || "").toLowerCase().includes(q)));
  const fbar = facetBar("alerts", defs, bySeverity, null, `<input id="alert-q" type="search" class="input w-56" value="${esc(ui.alertQuery)}" placeholder="${esc(t("alert_ph"))}" autocomplete="off">`);

// ================= settings =================

async function loadSettings() {
  const st = ui.settings;
  try {
    const d = await getJson("/api/settings");
    st.data = d;
    const v = d.values;
    st.form = { port: v.port === null ? "" : String(v.port), host: v.host || "127.0.0.1", interface: v.interface || "", filter: v.filter || "", promiscuous: !!v.promiscuous, verbose: !!v.verbose, egress_check: !!v.egress_check, show_window: !!v.show_window, notifications: v.notifications || "medium", autostart: d.autostart, journal_days: String(v.journal_days ?? 1), notify_snooze_until: Number(v.notify_snooze_until) || 0 };
    for (const c of ["security", "novelty", "network", "routes"]) st.form["cat_" + c] = !Array.isArray(v.notify_categories) || v.notify_categories.includes(c);
    getJson("/api/journal/stats").then((j) => { st.jstats = j; if (route.name === "settings") renderView(); }).catch(() => {});
  } catch (e) { st.status = { error: String(e.message || e) }; }
  if (route.name === "settings") renderView();
  if (st.interfaces === null) {
    try { st.interfaces = await getJson("/api/interfaces"); } catch (e) { st.interfaces = []; }
    if (route.name === "settings") renderView();
  }
}

async function saveSettings() {
  const st = ui.settings, f = st.form;
  if (!f || st.saving) return;
  st.saving = true; st.status = null; renderView();
  const body = { port: f.port.trim() === "" ? null : Number(f.port), port_auto: f.port.trim() === "", host: f.host.trim(), interface: f.interface, filter: f.filter.trim(), promiscuous: f.promiscuous, verbose: f.verbose, egress_check: f.egress_check, show_window: f.show_window, notifications: f.notifications, journal_days: Number(f.journal_days), notify_categories: ["security", "novelty", "network", "routes"].filter((c) => f["cat_" + c]) };
  if (st.data && st.data.autostart !== null && st.data.autostart !== undefined) body.autostart = !!f.autostart;
  try {
    const r = await fetch("/api/settings", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error && j.error.message ? j.error.message : r.statusText);
    st.status = { saved: true, restart: !!j.restart_required };
    st.saving = false;
    await loadSettings();
  } catch (e) { st.status = { error: String(e.message || e) }; st.saving = false; renderView(); }
}

// Ends the quiet period alone: the rest of the form (maybe edited, not saved) is not sent,
// and a snooze set from the tray or a toast after the page loaded is not overwritten by Save.
async function unsnooze() {
  const st = ui.settings;
  try {
    const r = await fetch("/api/settings", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ notify_snooze_until: 0 }) });
    if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.error && j.error.message ? j.error.message : r.statusText); }
    if (st.form) st.form.notify_snooze_until = 0;
  } catch (e) { st.status = { error: String(e.message || e) }; }
  if (route.name === "settings") renderView();
}

async function restartNow() {
  const st = ui.settings;
  st.restarting = true; renderView();
  try {
    const r = await fetch("/api/restart", { method: "POST" });
    if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.error && j.error.message ? j.error.message : r.statusText); }
  } catch (e) { st.restarting = false; st.status = { error: t("set_restart_fail", { e: String(e.message || e) }) }; renderView(); return; }
  // The server goes away for a moment; come back when it answers again (the desktop
  // app navigates the window itself if the port changed).
  const until = Date.now() + 30000;
  const probe = async () => {
    if (Date.now() > until) { st.restarting = false; renderView(); return; }
    try { const r = await fetch("/api/health", { cache: "no-store" }); if (r.ok) { location.reload(); return; } } catch (e) { /* still restarting */ }
    setTimeout(probe, 700);
  };
  setTimeout(probe, 1500);
}

// ================= journal (on-disk history) =================

function journalRange() {
  const now = Math.floor(Date.now() / 1000);
  const midnight = Math.floor(new Date(new Date().setHours(0, 0, 0, 0)).getTime() / 1000);
  return { today: midnight, "3d": now - 3 * 86400, "7d": now - 7 * 86400, all: null }[ui.journal.range];
}
function journalQs(format) {
  const j = ui.journal, qs = new URLSearchParams({ kind: j.kind, limit: "500" });
  const from = journalRange();
  if (from !== null) qs.set("from", String(from));
  if (j.q.trim()) qs.set("q", j.q.trim());
  if (format) qs.set("format", format);
  const f = j.kind === "log" ? "" : serverFacets(facetState("journal:" + j.kind), journalDefs(j.kind));
  if (f) qs.set("f", f);
  return qs.toString();
}
async function refreshJournal() {
  const j = ui.journal, seq = ++j.seq;
  j.error = null;
  try {
    if (j.kind === "log") { const l = await getJson("/api/logs?lines=300"); if (seq === j.seq) j.log = l; }
    else { const d = await getJson("/api/journal?" + journalQs()); if (seq === j.seq) j.data = d; }
    if (!j.stats) j.stats = await getJson("/api/journal/stats");
  } catch (e) { if (seq === j.seq) j.error = String(e.message || e); }
  if (seq === j.seq && route.name === "journal") renderView();
}
